<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Мой профиль</title><link rel="stylesheet" href="style.css"><main><header><a href="index.html">← Истории</a><b>МОЙ ПРОФИЛЬ</b></header><h1>Игрок №001</h1><div class="card"><div class="small">ВСЕГО ЗАРАБОТАНО</div><div class="coins" id="total">0</div><div class="small">баллов · демоверсия</div></div><div class="tab"><button class="btn secondary active" id="ratingBtn">РЕЙТИНГ</button><button class="btn secondary" id="collectionBtn">КОЛЛЕКЦИЯ</button></div><section id="rating"><h2>Рейтинг игроков</h2><p class="small">Остальные участники вымышлены для демонстрации.</p><div id="rows"></div></section><section id="collection" class="hidden"><h2>Моя коллекция</h2><div id="items"></div></section><a href="index.html" class="btn">К ДРУГИМ ИСТОРИЯМ</a><p class="small">Награды не связаны с реальным сервером. Очистка данных браузера удалит прогресс.</p></main><script>
const $=id=>document.getElementById(id);
let lift=!!localStorage.getItem('lift6_reward'),last=!!localStorage.getItem('lastman_reward');
let score=(lift?100:0)+(last?100:0);$('total').textContent=score;
let players=[{name:'Пиксель',score:320},{name:'Ключик',score:240},{name:'Игрок №001 (ты)',score},{name:'Кот_404',score:80}].sort((a,b)=>b.score-a.score);
$('rows').innerHTML=players.map((p,i)=>'<div class="card" style="display:flex;justify-content:space-between;margin:6px 0"><b>'+(i+1)+'. '+p.name+'</b><b>'+p.score+'</b></div>').join('');
$('items').innerHTML='<div class="card item '+(lift?'':'muted')+'"><span class="symbol">▦</span><div><b>Шашечки таксиста</b><div class="small">'+(lift?'Получено · Лифт №6':'Пока не получено')+'</div></div></div><div class="card item '+(last?'':'muted')+'"><span class="symbol">🚪</span><div><b>Стук в дверь последнего человека</b><div class="small">'+(last?'Получено · Последний человек':'Пока не получено')+'</div></div></div>';
function tab(which){$('rating').classList.toggle('hidden',which!=='rating');$('collection').classList.toggle('hidden',which!=='collection');$('ratingBtn').classList.toggle('active',which==='rating');$('collectionBtn').classList.toggle('active',which==='collection')}
$('ratingBtn').onclick=()=>tab('rating');$('collectionBtn').onclick=()=>tab('collection');
</script></html>
