<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Последний человек</title><link rel="stylesheet" href="style.css"><main><header><a href="index.html">← Истории</a><span class="small">МИКРОИСТОРИЯ №2</span></header><section id="start"><h1>Последний человек на Земле</h1><p>12 секунд. Надень наушники.</p><div class="card"><p>Никого не осталось. Почти.</p></div><button class="btn" id="play">НАЧАТЬ ИСТОРИЮ ▶</button></section><section id="movie" class="hidden"><video class="video" id="video" playsinline preload="auto" controlsList="nodownload" disablePictureInPicture></video><p id="status" class="small">Часть 1 из 2</p><button id="next" class="btn secondary hidden">ПРОДОЛЖИТЬ ▶</button></section><section id="reward" class="hidden"><p class="small">ИСТОРИЯ ЗАВЕРШЕНА</p><h1>КТО СТУЧАЛ?</h1><p>Ответа нет. Но кое-что осталось.</p><div class="split"><div class="card"><div class="symbol">◉</div><div class="coins">+100</div><div class="small">БАЛЛОВ</div></div><div class="card"><div class="symbol">🚪</div><b>Стук в дверь</b><div class="small">В КОЛЛЕКЦИЮ</div></div></div><p class="small" id="rewardNote">Награда будет добавлена после нажатия кнопки.</p><button class="btn" id="claim">ЗАБРАТЬ И УЙТИ</button></section></main><script>
const $=id=>document.getElementById(id);let part=1;
function show(id){for(const x of ['start','movie','reward'])$(x).classList.toggle('hidden',x!==id)}
function load(n){part=n;const v=$('video');v.src=n===1?'part1.mp4':'part2.mp4';v.load();$('status').textContent='Часть '+n+' из 2';$('next').classList.add('hidden');v.play().catch(()=>{$('next').textContent='НАЖМИ, ЧТОБЫ ПРОДОЛЖИТЬ ▶';$('next').classList.remove('hidden')})}
$('play').onclick=()=>{show('movie');load(1)};
$('video').onended=()=>{if(part===1)load(2);else{show('reward');$('rewardNote').textContent=localStorage.getItem('lastman_reward')?'Эта награда уже получена. Повторно баллы не начисляются.':'Нажми, чтобы добавить награду в коллекцию.'}};
$('next').onclick=()=>{$('video').play().then(()=>$('next').classList.add('hidden')).catch(()=>{})};
$('claim').onclick=()=>{try{if(!localStorage.getItem('lastman_reward'))localStorage.setItem('lastman_reward','100')}catch(e){}location.href='profile.html'};
</script></html>
